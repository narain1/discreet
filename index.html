<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<title>In-browser LLM Demo</title>
		<meta
			name="description"
			content="Chat with small language models running entirely in your browser — no server required." />

		<link rel="icon" type="image/x-icon" href="pink.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="styles.css" />

		<!-- Google Analytics -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-N1HTRD642Z"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());
			gtag('config', 'G-N1HTRD642Z');
		</script>
	</head>
	<body class="not-downloaded-yet">
		<main class="surface" id="centered">
			<header class="app-header">
				<span class="material-symbols-rounded app-icon" aria-hidden="true"
					>network_intelligence</span
				>
				<div>
					<h1>In-browser LLM Demo</h1>
					<p class="subtitle">
						Models run locally with WebAssembly — nothing leaves your machine.
					</p>
				</div>
			</header>

			<section class="field filled">
				<label for="model">Model</label>
				<div class="select-wrap">
					<select name="model" id="model" aria-label="Choose a model"></select>
					<span class="material-symbols-rounded trailing" aria-hidden="true"
						>expand_more</span
					>
				</div>
			</section>

			<section id="progress-bar-container" class="progress-card" aria-live="polite">
				<div class="progress-head">
					<span class="material-symbols-rounded" aria-hidden="true">download</span>
					<span class="progress-title">Downloading model…</span>
					<span id="progress-pct" class="progress-pct">0%</span>
				</div>
				<progress id="progress-bar" aria-label="Download progress"></progress>
				<div id="time-remaining" class="time-remaining"></div>
			</section>

			<section id="chat-container">
				<div id="output-container" aria-live="polite"></div>
			</section>

			<section class="field filled">
				<label for="prompt">Prompt</label>
				<textarea id="prompt" rows="3">How do I find east direction?</textarea>
			</section>

			<section class="setting">
				<div class="setting-label">
					<span>Temperature</span>
					<span id="temperature-value" class="chip">0.7</span>
				</div>
				<div class="slider-row">
					<span class="slider-bound">0.1</span>
					<input
						id="temperature"
						type="range"
						min="0.1"
						max="1.4"
						step=".1"
						value="0.7"
						aria-label="Temperature" />
					<span class="slider-bound">1.4</span>
				</div>
			</section>

			<div class="button-row">
				<button id="interrupt-button" class="btn btn-tonal" type="button">
					<span class="material-symbols-rounded" aria-hidden="true">stop</span>
					Stop
				</button>
				<button id="submit-button" class="btn btn-filled" type="button">
					<span class="material-symbols-rounded" aria-hidden="true">send</span>
					Generate
				</button>
			</div>
		</main>

		<script>
			(() => {
				const t = document.getElementById('temperature');
				const v = document.getElementById('temperature-value');
				if (t && v) t.addEventListener('input', () => (v.textContent = t.value));
			})();
		</script>
		<script type="module" src="index.js"></script>
	</body>
</html>
